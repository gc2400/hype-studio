<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hype Radio TV · Join live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#061423;--card:#0B2236;--deep:#071A2B;--line2:#23496B;--txt:#F2F6FA;--mut:#A9BCCD;--y:#FFE000;--b:#05A9C6;--g:#3DDC97;--r:#FF4D5E}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;font-weight:900}h1 b{color:var(--y)}
p{margin:0;color:var(--mut);font-size:15px;line-height:1.45}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;object-fit:cover;transform:scaleX(-1)}
.card{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
select{background:var(--deep);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-size:15px;min-height:46px;padding:0 10px;width:100%}
.btn{border:0;border-radius:14px;min-height:56px;font-size:17px;font-weight:800;cursor:pointer;width:100%}
.y{background:var(--y);color:var(--bg)}.o{background:transparent;color:var(--txt);border:1px solid var(--line2)}.r{background:var(--r);color:#fff}
.row{display:flex;gap:10px}.row .btn{flex:1}
.state{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--g)}.dot.live{background:var(--r);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.screens{display:flex;flex-direction:column;gap:10px}
.air{position:relative}.air video{transform:none;object-fit:contain}
.air .tag{position:absolute;left:10px;top:10px;background:var(--r);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;padding:3px 8px;border-radius:6px}
.air .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
body.incall .wrap{max-width:1100px}
@media (min-width:760px){body.incall .screens{display:grid;grid-template-columns:2fr 1fr;align-items:start}}
@media (max-width:759px){body.incall .screens{position:relative}body.incall #me:not([hidden]){position:absolute;right:8px;bottom:8px;width:32%;border:2px solid var(--bg);border-radius:10px;z-index:2}}
.meter{height:8px;border-radius:5px;background:var(--deep);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--g)}
</style>
</head>
<body>
<div class="wrap">
  <h1>HYPE <b>RADIO TV</b></h1>
  <div id="bad" hidden class="card"><p id="badMsg"></p></div>
  <div id="ok" hidden style="display:flex;flex-direction:column;gap:14px">
    <p>Hi <b id="gName" style="color:#fff"></b> – you're invited to <b id="gShow" style="color:#fff"></b>. <b style="color:#fff">Use headphones</b> (earbuds are fine), so we don't hear ourselves back.</p>
    <div class="screens" id="screens"><div class="air" id="airBox" hidden><video id="air" muted playsinline autoplay></video><span class="tag">ON AIR</span><span class="wait" id="airWait">Loading the picture…</span></div><video id="me" muted playsinline autoplay></video></div>
    <div class="card" id="setup">
      <label>Camera<select id="cam"></select></label>
      <label>Microphone<select id="mic"></select></label>
      <div class="meter"><i id="lvl"></i></div>
    </div>
    <div class="row" id="joinRow"><button class="btn y" id="joinV">Join with video</button><button class="btn o" id="joinA">Audio only</button></div>
    <div class="card" id="inCall" hidden>
      <div class="state"><span class="dot" id="dot"></span><span id="st">Connecting…</span></div>
      <p id="tip">You hear the studio. When the host brings you in, you're on air.</p>
      <div class="row"><button class="btn o" id="mute">Mute mic</button><button class="btn r" id="leave">Leave</button></div>
    </div>
  </div>
</div>
<audio id="studio" autoplay playsinline></audio>
<script src="hype-rtc.js"></script>
<script>
const $ = s => document.querySelector(s);
const T = new URLSearchParams(location.search).get('t') || '';
let ME = null, stream = null, pub = null, ret = null, air = null, others = {}, muted = false;
function fail(m) { $('#bad').hidden = false; $('#ok').hidden = true; $('#badMsg').textContent = m; }
async function info() { const r = await fetch('/api/guest_info?t=' + encodeURIComponent(T), {cache: 'no-store'}); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'not valid'); return j; }
async function devices() {
  const d = await navigator.mediaDevices.enumerateDevices();
  $('#cam').innerHTML = d.filter(x => x.kind === 'videoinput').map(x => `<option value="${x.deviceId}">${x.label || 'Camera'}</option>`).join('');
  $('#mic').innerHTML = d.filter(x => x.kind === 'audioinput').map(x => `<option value="${x.deviceId}">${x.label || 'Microphone'}</option>`).join('');
}
async function preview(video = true) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {deviceId: $('#mic').value ? {exact: $('#mic').value} : undefined, echoCancellation: true, noiseSuppression: true, autoGainControl: true},
    video: video ? {deviceId: $('#cam').value ? {exact: $('#cam').value} : undefined, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30}} : false});
  $('#me').srcObject = stream; $('#me').hidden = !video;
  HypeRTC.meter(stream, v => { $('#lvl').style.width = Math.min(100, v * 120) + '%'; });
}
function state(name, s) {
  if (name !== 'me') return;
  const on = s === 'connected'; $('#dot').className = 'dot ' + (on ? 'on' : '');
  $('#st').textContent = on ? 'Connected to the studio' : s === 'connecting' ? 'Connecting…' : 'Reconnecting… (' + s + ')';
}
async function join(video) {
  try { await preview(video); } catch (e) { return alert('Please allow ' + (video ? 'camera and ' : '') + 'microphone.'); }
  $('#setup').hidden = true; $('#joinRow').hidden = true; $('#inCall').hidden = false;
  pub = HypeRTC.keep('me', () => HypeRTC.publish(ME.slot, stream, {key: T, videoKbps: 1800, audioKbps: 64, stereo: false}), state);
  // what you hear: the studio (mix-minus) + the other guests
  ret = HypeRTC.keep('studio', async () => { const r = await HypeRTC.play('mixminus', {key: T}); $('#studio').srcObject = r.stream; $('#studio').play().catch(() => {}); return r; }, () => {});
  setInterval(listenOthers, 3000); listenOthers();
  // what is on air: a small picture (it follows your connection), next to your own camera - no sound (you hear the studio)
  document.body.classList.add('incall'); $('#airBox').hidden = false;
  air = HypeRTC.keep('air', async () => { const r = await HypeRTC.play('guestview', {key: T, video: true, audio: false}); $('#air').srcObject = r.stream; $('#air').play().catch(() => {});
    $('#air').onplaying = () => { $('#airWait').hidden = true; }; return r; }, () => {});
}
async function listenOthers() {
  let j; try { j = await info(); } catch (e) { return; }
  if (j.live) $('#dot').className = 'dot live';
  j.others.forEach(s => { if (others[s]) return; const a = new Audio(); a.autoplay = true; document.body.appendChild(a);
    others[s] = {a, c: HypeRTC.keep(s, async () => { const r = await HypeRTC.play(s, {key: T}); a.srcObject = r.stream; a.play().catch(() => {}); return r; }, () => {})}; });
  Object.keys(others).forEach(s => { if (!j.others.includes(s)) { others[s].c.close(); others[s].a.remove(); delete others[s]; } });
}
$('#joinV').onclick = () => join(true); $('#joinA').onclick = () => join(false);
$('#mute').onclick = () => { muted = !muted; stream.getAudioTracks().forEach(t => t.enabled = !muted); $('#mute').textContent = muted ? 'Unmute mic' : 'Mute mic'; $('#mute').className = 'btn ' + (muted ? 'y' : 'o'); };
$('#leave').onclick = () => { pub && pub.close(); ret && ret.close(); air && air.close(); air = null; $('#airBox').hidden = true; document.body.classList.remove('incall'); Object.values(others).forEach(o => o.c.close()); stream && stream.getTracks().forEach(t => t.stop()); $('#inCall').hidden = true; $('#joinRow').hidden = false; $('#setup').hidden = false; $('#tip').textContent = ''; };
$('#cam').onchange = () => preview(true).catch(() => {}); $('#mic').onchange = () => preview(!(ME && ME.mode === 'audio')).catch(() => {});
info().then(async j => { ME = j; $('#ok').hidden = false; $('#gName').textContent = j.name; $('#gShow').textContent = j.show || 'Hype Radio TV';
  const audioOnly = j.mode === 'audio';   // the host invited you as a phone-style (audio only) guest
  if (audioOnly) { $('#joinV').hidden = true; $('#joinA').textContent = 'Join (audio only)'; $('#joinA').className = 'btn y'; $('#cam').closest('label').hidden = true; $('#me').hidden = true; }
  try { await preview(!audioOnly); } catch (e) {} await devices(); if (audioOnly) $('#cam').closest('label').hidden = true; }).catch(e => fail(e.message));
</script>
</body>
</html>
