limit_req_zone $binary_remote_addr zone=hypelogin:1m rate=10r/m;
# ---- protection for the public streams (stream.hyperadio.nl): one address can't hog the server; a total cap keeps room for the panel / studio ----
# trusted addresses are never limited: the server itself + partners that pull the stream once for many viewers (IPTV) – add their IPs here
geo $hype_trusted {
  default 0;
  127.0.0.1 1;
  ::1 1;
  # 203.0.113.10 1;   # e.g. an IPTV partner's server
}
map $hype_trusted $hype_ip_key { 0 $binary_remote_addr; 1 ""; }   # an empty key = no limit
limit_conn_zone $hype_ip_key zone=hype_ip:10m;
limit_conn_zone $server_name zone=hype_mp3_total:1m;   # all radio listeners together
limit_conn_zone $server_name zone=hype_tv_total:1m;    # all TV pieces being sent at once
limit_req_zone $hype_ip_key zone=hype_req:10m rate=25r/s;   # one TV viewer asks ~2 requests/s since the separate audio track (2 playlists + 2 pieces every 2 s), more at the start: 25/s ≈ 10 viewers on one address (a home, office, café)
server { listen 80; server_name tv.hyperadio.nl studio.hyperadio.nl stream.hyperadio.nl; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name tv.hyperadio.nl;
  ssl_certificate /etc/letsencrypt/live/tv.hyperadio.nl/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/tv.hyperadio.nl/privkey.pem;
  location / { return 404; }
  # the old test links are gone: everything is on https://stream.hyperadio.nl (radio.mp3, radio.m3u8, tv/master.m3u8)
}
server {
  listen 443 ssl http2; server_name studio.hyperadio.nl;
  add_header Cache-Control "no-cache" always;   # pages + scripts: the browser always checks for a newer version
  ssl_certificate /etc/letsencrypt/live/tv.hyperadio.nl/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/tv.hyperadio.nl/privkey.pem;
  root /var/www/studio; index index.html;
  add_header X-Robots-Tag "noindex" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # every request needs a valid login session
  auth_request /_auth;
  error_page 401 = @login;
  location @login { return 302 /login?next=$request_uri; }
  location @api401 { default_type application/json; return 401 '{"error":"login"}'; }
  location = /_auth {
    internal; proxy_pass http://127.0.0.1:8091/_auth;
    proxy_pass_request_body off; proxy_set_header Content-Length "";
  }
  location = /login {
    auth_request off; limit_req zone=hypelogin burst=5 nodelay; limit_req_status 429;
    proxy_pass http://127.0.0.1:8091; proxy_set_header X-Real-IP $remote_addr;
  }
  location = /logout { auth_request off; proxy_pass http://127.0.0.1:8091; }

  location ~ \.(json|csv)$ { error_page 401 = @api401; add_header Cache-Control "no-store"; }
  location = /stats.json { error_page 401 = @api401; add_header Cache-Control "no-store"; }
  location /media/ { alias /srv/hype/; add_header Cache-Control "no-store"; }
  location /pvclip/ { alias /srv/hype-data/pvclip/; add_header Cache-Control "no-store"; }   # phone previews (H.264 copies of VP9 / AV1 videos)
  location /api/ { error_page 401 = @api401; proxy_pass http://127.0.0.1:8090; proxy_read_timeout 120s; client_max_body_size 1m; }
  location = /api/upload/chunk { error_page 401 = @api401; proxy_pass http://127.0.0.1:8090; proxy_read_timeout 300s; client_max_body_size 12m; }   # Library upload: 8 MB pieces
  location = /panel { return 301 /panel/; }
  # phase 4: WebRTC to MediaMTX (it checks the studio key / guest links itself), the public guest page
  location /live/ {
    auth_request off; client_max_body_size 1m; access_log off;   # stream keys travel in these URLs: keep them out of the logs
    proxy_pass http://127.0.0.1:8889/; proxy_http_version 1.1;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /guest/ { auth_request off; alias /var/www/guest/; index index.html; add_header Cache-Control "no-store"; }
  location = /api/guest_info { auth_request off; proxy_pass http://127.0.0.1:8090; }
}

# radio.mp3 goes through the MP3 gate (every listener starts on a clean MP3 frame → Chrome/Edge play in ~1 s);
# if the gate is ever down, nginx falls back to Icecast directly by itself
upstream hype_mp3 { server 127.0.0.1:8002 max_fails=1 fail_timeout=10s; server 127.0.0.1:8000 backup; }

# ---- public radio streams: https://stream.hyperadio.nl/radio.mp3 (MP3 128k) · /radio.m3u8 (HLS AAC 128k) ----
server {
  listen 443 ssl http2; server_name stream.hyperadio.nl;
  limit_req zone=hype_req burst=100 nodelay; limit_req_status 429;   # a player fetches several pieces at once when it starts / switches quality
  limit_conn hype_ip 24; limit_conn_status 429;
  ssl_certificate /etc/letsencrypt/live/tv.hyperadio.nl/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/tv.hyperadio.nl/privkey.pem;
  access_log /var/log/nginx/stream.access.log;
  add_header Access-Control-Allow-Origin * always;
  location = / { default_type text/plain; return 200 "Hype Radio TV streams: /radio.mp3 (MP3 128 kbps) · /radio.m3u8 (HLS AAC 128 kbps)\n"; }
  location = /radio.mp3 {
    limit_conn hype_ip 4; limit_conn hype_mp3_total 3000;   # max 4 radio streams per address, 3000 in all
    proxy_pass http://hype_mp3/radio.mp3; proxy_connect_timeout 2s; proxy_next_upstream error timeout; proxy_buffering off; proxy_request_buffering off;
    proxy_read_timeout 1d; proxy_send_timeout 1d; proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Icy-MetaData $http_icy_metadata;
    add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-cache, no-store" always;
    add_header Accept-Ranges none always;     # live radio can't be skipped through: iPhone players stop probing with byte ranges sooner
    mirror /_mp3hit; mirror_request_body off;     # tells the engine who started listening (for unique listeners); never waits on it
  }
  location = /_mp3hit { internal; proxy_pass http://127.0.0.1:8090/mp3hit; proxy_pass_request_body off; proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-UA $http_user_agent; proxy_connect_timeout 1s; proxy_read_timeout 2s; }
  location = /radio.m3u8 { alias /dev/shm/radio-hls/radio.m3u8; types { } default_type application/vnd.apple.mpegurl; add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-cache" always; }
  location ~ ^/(r[0-9]+\.ts)$ { alias /dev/shm/radio-hls/$1; types { } default_type video/mp2t; add_header Access-Control-Allow-Origin * always; add_header Cache-Control "public, max-age=60" always; }
  location = /api/nowplaying/hype_radio {
    # a browser's CORS check first (OPTIONS, e.g. Pro.Radio's player): answer it here – the engine only knows GET (gave 501)
    if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin * always; add_header Access-Control-Allow-Methods "GET, OPTIONS" always; add_header Access-Control-Allow-Headers "*" always; add_header Access-Control-Max-Age 86400 always; return 204; }
    proxy_pass http://127.0.0.1:8090/nowplaying; add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-cache" always; }
  location = /api/nowplaying {
    # a browser's CORS check first (OPTIONS, e.g. Pro.Radio's player): answer it here – the engine only knows GET (gave 501)
    if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin * always; add_header Access-Control-Allow-Methods "GET, OPTIONS" always; add_header Access-Control-Allow-Headers "*" always; add_header Access-Control-Max-Age 86400 always; return 204; }
    proxy_pass http://127.0.0.1:8090/nowplaying; add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-cache" always; }
  # the TV (video) stream on the same address: https://stream.hyperadio.nl/tv/master.m3u8 (1080/720/480/360, auto quality)
  location /tv/ { limit_conn hype_ip 24; limit_conn hype_tv_total 800; alias /dev/shm/hls/; types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; } add_header Access-Control-Allow-Origin * always; add_header Cache-Control "no-cache" always;
    # video pieces never change (unique names): browsers / providers / a CDN may keep them
    location ~ \.ts$ { types { video/mp2t ts; } add_header Access-Control-Allow-Origin * always; add_header Cache-Control "public, max-age=600, immutable" always; } }
  location / { return 404; }
}

# ---- OBS only (this server itself): the live input pages for the browser sources (studio sound, cameras, guests) ----
server {
  listen 127.0.0.1:8097;   # (8095 is taken by a dev helper)
  root /var/www/obs;
  location / { add_header Cache-Control "no-store"; }
}
