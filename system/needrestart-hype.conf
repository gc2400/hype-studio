# Ubuntu's automatic security updates (unattended-upgrades) run needrestart, which restarts every service that uses an
# updated library – on 4 Nov 06:53 that restarted the radio, the audio bus, OBS, nginx and the engine at once, several
# times (= ~3 min of silence on air). Hype's services are never restarted by it: the updates are still installed, and
# a service picks up the new library at its next normal restart (an update from GitHub, or a reboot).
$nrconf{override_rc}{qr(^hype-)} = 0;
$nrconf{override_rc}{qr(^nginx)} = 0;
$nrconf{override_rc}{qr(^mediamtx)} = 0;
